:root{

  color-scheme:light;
}

    --bg:#121417; --card:#1b1e23; --line:#2e333b; --grid:#262a31; --s1:#4a93e8; --s2:#e8794e; --s3:#2bb487; --good:#3cb371; --warn:#e0a32a; --bad:#f07b4a; color-scheme:dark;}
}
:root[data-theme="dark"]{ --acc:#f87171; --ink:#eef0f3; --ink-2:#c0c5ce; --ink-3:#8c93a0;
  --bg:#121417; --card:#1b1e23; --line:#2e333b; --grid:#262a31; --s1:#4a93e8; --s2:#e8794e; --s3:#2bb487; --good:#3cb371; --warn:#e0a32a; --bad:#f07b4a; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 10px;border-radius:999px}
nav a.on,nav a:hover{background:var(--acc-soft);color:var(--acc)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
header.hero{background:var(--hero);color:#fff;padding:48px 16px 40px}
header.hero .in{max-width:1080px;margin:0 auto}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-size:clamp(30px,5vw,48px);margin:4px 0 8px;letter-spacing:-.02em;line-height:1.1}
.hero p{margin:0;max-width:680px;opacity:.92;font-size:17px}
.stamp{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stamp span{font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.kpi{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;opacity:.85}
section{padding-top:56px;scroll-margin-top:60px}
h2{font-size:28px;letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.founder{display:flex;gap:14px;align-items:flex-start}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.founder h4{margin:0;font-size:16px}.founder p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3)}
.tl{display:flex;overflow-x:auto;padding:8px 0 4px}
.tl button{flex:1 0 104px;background:none;border:0;cursor:pointer;padding:28px 6px 8px;position:relative;color:var(--ink-2);font:inherit;font-size:13px;text-align:center}
.tl button::before{content:"";position:absolute;top:12px;left:0;right:0;height:3px;background:var(--line)}
.tl button::after{content:"";position:absolute;top:6px;left:50%;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--card);border:3px solid var(--acc)}
.tl button.on{color:var(--acc);font-weight:700}
.tl button.on::after{background:var(--acc)}
.tl-detail{margin-top:10px;min-height:96px}
.tl-detail h3{margin:0 0 4px;font-size:18px}
.ch{cursor:pointer;transition:transform .15s;text-align:left;font:inherit;color:inherit;width:100%}
.ch:hover{transform:translateY(-2px)}
.ch .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ch h4{margin:6px 0 4px;font-size:16px}
.ch p{margin:0;font-size:14px;color:var(--ink-2)}
.ch .more{display:none;margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px;color:var(--ink)}
.ch.open .more{display:block}
.ch .hint{font-size:12px;color:var(--acc);margin-top:8px}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--grid);border-radius:999px;padding:3px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
svg text{fill:var(--ink-3);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
svg .val{fill:var(--ink);font-weight:600}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:20;max-width:280px}
.tip b{display:block;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.evlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;background:var(--card);text-align:left;font-family:inherit;color:var(--ink-2)}
.ev b{display:block;color:var(--ink)}
.ev .p{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.ev.on{border-color:var(--acc);background:var(--acc-soft)}
.seg{border-top:4px solid var(--c,var(--acc))}
.seg .big{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--grid);color:var(--ink-2);margin:2px 4px 2px 0}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.val-card{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;font:inherit;color:inherit}
.val-card .n{font-size:13px;font-weight:700;color:var(--acc)}
.val-card h4{margin:6px 0 0;font-size:16px;line-height:1.3}
.val-card.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.val-card.on .n{color:var(--acc-ink)}
.callout{border-left:4px solid var(--acc);background:var(--acc-soft);padding:14px 16px;border-radius:0 12px 12px 0;font-size:15px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-3);font-weight:600}
td.r,th.r{text-align:right}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:10px}
.src li{font-size:13px;margin-bottom:4px}
.meter{height:8px;background:var(--grid);border-radius:999px;overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--acc)}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.sig b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 4px}
input[type=search]{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:12px}
.gitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:16px}
</style>
</head>

    const y0=P[0][0].getFullYear(),y1=P[P.length-1][0].getFullYear();for(let y=y0+1;y<=y1;y++){const x=X(new Date(y+'-01-01'));if(x>m.l+10&&x<W-m.r-10){txt(svg,x,H-10,y,{'text-anchor':'middle'});el('line',{x1:x,x2:x,y1:H-m.b,y2:H-m.b+4,stroke:'var(--ink-3)'},svg);}}
    if(mode==='rel')el('line',{x1:m.l,x2:W-m.r,y1:Y(100),y2:Y(100),stroke:'var(--ink-3)','stroke-dasharray':'4 4'},svg);
    const path=S=>S.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
    if(S2)el('path',{d:path(S2),fill:'none',stroke:'var(--ink-3)','stroke-width':1.5,'stroke-dasharray':'5 3'},svg);
    const d1=path(S1);el('path',{d:d1+`L${X(S1[S1.length-1][0])},${Y(ymin)}L${X(S1[0][0])},${Y(ymin)}Z`,fill:'var(--acc)',opacity:.09},svg);
    el('path',{d:d1,fill:'none',stroke:'var(--acc)','stroke-width':2.2,'stroke-linejoin':'round'},svg);
    const last=S1[S1.length-1];el('circle',{cx:X(last[0]),cy:Y(last[1]),r:4.5,fill:'var(--acc)'},svg);
    txt(svg,X(last[0])-6,Y(last[1])-10,mode==='price'?'$'+last[1].toFixed(2):Math.round(last[1]),{'text-anchor':'end',class:'val'});
    const cross=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--ink-3)',opacity:0},svg),dot=el('circle',{r:4,fill:'var(--acc)',opacity:0},svg);
    const ov=el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'transparent'},svg);
    ov.onmousemove=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width;let bi=0;S1.forEach((p,i)=>{if(Math.abs(X(p[0])-px)<Math.abs(X(S1[bi][0])-px))bi=i;});const p=S1[bi];
      cross.setAttribute('x1',X(p[0]));cross.setAttribute('x2',X(p[0]));cross.setAttribute('opacity',.5);dot.setAttribute('cx',X(p[0]));dot.setAttribute('cy',Y(p[1]));dot.setAttribute('opacity',1);
      const sv=S2?near(S2,p[0])[1]:null;
      showTip(ev,mode==='price'?`<b>$${p[1].toFixed(2)}</b>${p[0].toLocaleDateString('en-US',{month:'short',year:'numeric'})} month-end close`:`<b>${R.ticker} ${Math.round(p[1])} · S&amp;P 500 ${Math.round(sv)}</b>${p[0].toLocaleDateString('en-US',{month:'short',year:'numeric'})}, both start at 100`);};
    ov.onmouseleave=()=>{cross.setAttribute('opacity',0);dot.setAttribute('opacity',0);hideTip();};
    EV.forEach((e,i)=>{const v=mode==='price'?e.p:e.p/base*100;const c=el('circle',{cx:X(e.d),cy:Y(v),r:i===evSel?8:5,fill:i===evSel?'var(--acc)':'var(--card)',stroke:'var(--acc)','stroke-width':2,style:'cursor:pointer'},svg);
      c.onclick=()=>sel(i);c.onmousemove=ev=>showTip(ev,`<b>${e.t}</b>${e.x}`);c.onmouseleave=hideTip;});
    lg.innerHTML=mode==='rel'?`<span><i style="background:var(--acc)"></i>${R.ticker}</span><span><i style="background:var(--ink-3)"></i>S&amp;P 500 (SPY), dashed</span>`:'';};
  const sel=i=>{evSel=i;[...list.children].forEach((n,j)=>n.classList.toggle('on',i===j));draw();};
  list.innerHTML=EV.map((e,i)=>`<button class="ev" data-i="${i}"><span class="p">$${e.p.toFixed(2)}</span><b>${e.t}</b>${e.d.toLocaleDateString('en-US',{month:'short',year:'numeric'})}</button>`).join('');
  list.onclick=e=>{const x=e.target.closest('button');if(x)sel(+x.dataset.i);};
  const tb=host.querySelector('.tabs');tb.onclick=e=>{const x=e.target.closest('button');if(!x)return;mode=x.dataset.m;[...tb.children].forEach(y=>y.classList.toggle('on',y===x));draw();};
  redraw.push(draw);};
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}

B.segments=(b,host)=>{host.className='grid2';host.innerHTML=b.items.map(s=>`<div class="card seg" style="--c:${s.color||'var(--acc)'}"><h3 style="margin:0 0 6px">${s.title}</h3><div class="big">${s.big}</div><div class="note" style="margin-bottom:8px">${s.sub}</div><p style="margin:0 0 8px;font-size:14px">${s.text}</p>${(s.pills||[]).map(p=>`<span class="pill ${p[0]}">${p[1]}</span>`).join('')}${s.more?`<details><summary>More</summary><p style="font-size:14px;color:var(--ink-2)">${s.more}</p></details>`:''}</div>`).join('');};

B.hbars=(b,host)=>{host.className='card';host.innerHTML=`<div class="eyebrow">${b.eyebrow}</div><div class="chartbox" style="margin-top:8px"></div><p class="note">${b.note||''}</p>`;
  const box=host.querySelector('.chartbox');const f=FMT[b.fmt||'pct1'];
  const draw=()=>{box.innerHTML='';const W=Math.max(box.clientWidth,300),rh=28,m={t:6,l:Math.min(170,W*.4),r:56,b:6},H=m.t+b.items.length*rh+m.b;
    const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},box);const max=b.max||Math.max(...b.items.map(i=>i[1]))*1.05;const X=v=>m.l+v/max*(W-m.l-m.r);
    b.items.forEach((p,i)=>{const y=m.t+i*rh+5;const r=el('rect',{x:m.l,y,width:Math.max(X(Math.abs(p[1]))-m.l,2),height:rh-10,rx:4,fill:p[3]||'var(--acc)'},svg);
      txt(svg,m.l-8,y+13,p[0],{'text-anchor':'end',style:'fill:var(--ink-2);font-size:12px'});txt(svg,X(p[1])+6,y+13,f(p[1]),{class:'val'});
      r.onmousemove=e=>showTip(e,`<b>${p[0]}: ${f(p[1])}</b>${p[2]||''}`);r.onmouseleave=hideTip;});};
  redraw.push(draw);};

B.facts=(b,host)=>{host.className='card';host.innerHTML=`<div class="eyebrow">${b.eyebrow||'Key facts'}</div><div class="tblwrap"><table>${b.items.map(r=>`<tr><th style="width:38%">${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div>`;};

B.values=(b,host)=>{const id='v'+(++uid);host.className='stack';host.innerHTML=`<div class="grid3"></div><div class="card" aria-live="polite"></div>`;
  const g=host.firstChild,det=host.lastChild;
  const sel=i=>{[...g.children].forEach((x,j)=>x.classList.toggle('on',i===j));const v=b.items[i];det.innerHTML=`<div class="eyebrow">${b.label||'Priority'} 0${i+1}</div><h3 style="margin:4px 0">${v[0]}</h3><p style="margin:0 0 6px"><b>What it means:</b> ${v[1]}</p><p style="margin:0;color:var(--ink-2)"><b>In practice:</b> ${v[2]}</p>`;};
  b.items.forEach((v,i)=>{const x=document.createElement('button');x.className='val-card';x.innerHTML=`<div class="n">0${i+1}</div><h4>${v[0]}</h4>`;x.onclick=()=>sel(i);g.appendChild(x);});sel(0);};

B.callout=(b,host)=>{host.className='callout';host.innerHTML=b.html;};

B.radar=(b,host)=>{const H_=R.holders,S=R.score;host.className='stack';
  host.innerHTML=`<div class="grid2"><div class="card"><div class="eyebrow">Tracked funds holding ${R.ticker}, by quarter</div><div class="chartbox" style="margin-top:8px"></div><p class="note">Count of the ~20 tracked funds reporting a long position in their 13F filing for each quarter-end.</p></div>
    <div class="card"><div class="eyebrow">Radar score breakdown</div><p style="margin:6px 0 12px;font-size:14px;color:var(--ink-2)">Each signal is a percentile among the ${R.kind==='ETF'?'ETF':'stock'} candidates (1.00 = best). Score = 45% performance + 35% breadth + 20% accumulation.</p>
    <div class="sig">${[['Radar score',S.score],['Performance',S.performance],['Under-the-radar breadth',S.breadth],['Accumulation',S.accumulation]].map(s=>`<div><div class="note">${s[0]}</div><b>${s[1].toFixed(2)}</b><div class="meter"><div style="width:${Math.round(s[1]*100)}%"></div></div></div>`).join('')}</div>
    <p class="note" style="margin-top:14px">${S.why}</p></div></div>
    <div class="card"><div class="eyebrow">Who holds it (${H_.latest_label} 13F)</div><div class="tblwrap"><table><tr><th>Fund</th><th class="r">Position value</th><th class="r">Share of long book</th><th class="r">Shares</th><th>vs. prior quarter</th></tr>
    ${H_.latest.map(h=>`<tr><td>${h.fund}</td><td class="r">${FMT.usdM(h.value/1e6)}</td><td class="r">${(h.weight*100).toFixed(2)}%${h.weight>=0.0005?' <span class="pill g">conviction</span>':''}</td><td class="r">${h.shares.toLocaleString('en-US')}</td><td>${h.change}</td></tr>`).join('')}</table></div>
    <p class="note">A "conviction" position is at least 0.05% of the fund's 13F long book, the same cut the Insights tab uses. 13F filings show long US-listed positions only, up to 45 days after quarter-end, so these may have changed since.</p></div>`+(b.html?`<div class="callout">${b.html}</div>`:'');
  const box=host.querySelector('.chartbox');redraw.push(()=>barChart(box,H_.by_quarter.map(q=>[q[0],q[1],q[2]]),FMT.num,{h:220}));};

B.targets=(b,host)=>{host.className='card';host.innerHTML=`<div class="eyebrow">Where analysts put the stock (12-month targets)</div><div class="chartbox" style="margin-top:8px"></div><div class="legend"><span><i style="background:var(--s3)"></i>Above current price</span><span><i style="background:var(--s2)"></i>Below current price</span><span><i style="background:var(--acc)"></i>Current price</span><span><i style="background:var(--ink-3)"></i>Consensus, dashed</span></div><p class="note">${b.note}</p>`;
  const box=host.querySelector('.chartbox');const cur=R.last_price;
  const draw=()=>{box.innerHTML='';const W=Math.max(box.clientWidth,300),rh=28,m={t:10,l:120,r:46,b:22},H=m.t+b.items.length*rh+m.b;
    const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'},box);const max=niceStep(Math.max(...b.items.map(p=>p[1]),cur)/4)*5;const X=v=>m.l+v/max*(W-m.l-m.r);
    for(let v=0;v<=max;v+=max/5){el('line',{x1:X(v),x2:X(v),y1:m.t,y2:H-m.b,stroke:'var(--grid)'},svg);txt(svg,X(v),H-6,'$'+Math.round(v),{'text-anchor':'middle'});}
    b.items.forEach((p,i)=>{const y=m.t+i*rh+5;const r=el('rect',{x:m.l,y,width:X(p[1])-m.l,height:rh-10,rx:4,fill:p[1]>=cur?'var(--s3)':'var(--s2)'},svg);
      txt(svg,m.l-8,y+13,p[0],{'text-anchor':'end',style:'fill:var(--ink-2);font-size:12px'});txt(svg,X(p[1])+6,y+13,'$'+p[1],{class:'val'});
      r.onmousemove=e=>showTip(e,`<b>${p[0]}: $${p[1]}</b>${p[2]}<br>${((p[1]/cur-1)*100).toFixed(0)}% vs $${cur.toFixed(2)}`);r.onmouseleave=hideTip;});
    el('line',{x1:X(cur),x2:X(cur),y1:m.t-6,y2:H-m.b,stroke:'var(--acc)','stroke-width':2.5},svg);
    if(b.avg)el('line',{x1:X(b.avg),x2:X(b.avg),y1:m.t-6,y2:H-m.b,stroke:'var(--ink-3)','stroke-dasharray':'4 3','stroke-width':1.5},svg);};
  redraw.push(draw);};

B.oppRisk=(b,host)=>{host.className='card';let k='opp';
  host.innerHTML=`<div class="tabs"><button class="on" data-k="opp">Opportunities</button><button data-k="risk">Risks</button></div><div class="grid3"></div>`;
  const g=host.querySelector('.grid3');const draw=()=>{g.innerHTML=b[k].map(o=>`<div class="card" style="border-top:4px solid ${k==='opp'?'var(--s3)':'var(--s2)'}"><h4 style="margin:0 0 6px">${o[0]}</h4><p style="margin:0;font-size:14px;color:var(--ink-2)">${o[1]}</p></div>`).join('');};
  const tb=host.querySelector('.tabs');tb.onclick=e=>{const x=e.target.closest('button');if(!x)return;k=x.dataset.k;[...tb.children].forEach(y=>y.classList.toggle('on',y===x));draw();};draw();};

B.bullbear=(b,host)=>{host.className='card';const id='bb'+(++uid);
  host.innerHTML=`<label class="eyebrow" for="${id}">Bull vs. bear: drag to see each side's argument</label><input type="range" id="${id}" min="0" max="${b.items.length-1}" value="${Math.floor(b.items.length/2)}"><div style="display:flex;justify-content:space-between" class="note"><span>Most bearish</span><span>Neutral</span><span>Most bullish</span></div><div class="callout" style="margin-top:12px" aria-live="polite"></div>`;
  const r=host.querySelector('input'),out=host.querySelector('.callout');const draw=()=>{const v=b.items[+r.value];out.innerHTML=`<b>${v[0]}</b><br>${v[1]}`;};r.oninput=draw;draw();};

B.catalysts=(b,host)=>{host.className='card';host.innerHTML=`<div class="eyebrow">${b.eyebrow||'Catalysts to watch (next ~12 months)'}</div><div class="tblwrap"><table><tr><th>When</th><th>What</th><th>Why it matters</th></tr>${b.items.map(r=>`<tr><td style="white-space:nowrap">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`;};

B.annual=(b,host)=>{host.className='card';host.innerHTML=`<div class="eyebrow">${b.eyebrow||'Calendar-year price return'}</div><div class="chartbox" style="margin-top:8px"></div><p class="note">${b.note||''}</p>`;
  const P=R.prices[R.ticker],SP=R.prices.SPY;const yr=(S,y)=>{const prev=S.filter(p=>+p[0].slice(0,4)<y).pop(),end=S.filter(p=>+p[0].slice(0,4)===y).pop();return prev&&end?(end[1]/prev[1]-1)*100:null;};
  const years=[...new Set(P.map(p=>+p[0].slice(0,4)))];const last=P[P.length-1][0];
  const data=years.map(y=>{const v=yr(P,y),s=yr(SP,y);return v==null?null:[y===+last.slice(0,4)?y+' YTD':String(y),v,`S&amp;P 500 (SPY) ${s==null?'n/a':FMT.pct(s)} the same year`];}).filter(Boolean);
  const box=host.querySelector('.chartbox');redraw.push(()=>barChart(box,data,FMT.pct,{h:240}));};

B.row=(b,host)=>{host.className='grid2';b.items.forEach(x=>{const d=document.createElement('div');host.appendChild(d);B[x.type](x,d);});};

/* ---------- chapters ---------- */
const main=$('#main');
chapters.forEach((c,i)=>{const s=document.createElement('section');s.id=c.id;
  s.innerHTML=`<div class="eyebrow">Chapter ${i+1}</div><h2>${c.title}</h2><p class="lede">${c.lede}</p><div class="stack"></div>`;
  const st=s.querySelector('.stack');c.blocks.forEach(b=>{const d=document.createElement('div');st.appendChild(d);B[b.type](b,d);});main.appendChild(s);});

/* ---------- sources + glossary ---------- */
const src=document.createElement('section');src.id='sources';
src.innerHTML=`<h2>Sources</h2><ul class="src">${R.sources.map(s=>`<li>${s.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(' · ')}</li>`).join('')}</ul>
 <p class="note">Prices are month-end closes from Yahoo Finance; the final point is the ${R.prices_asof} close. 13F data comes from this project's SEC EDGAR pipeline. Figures marked "≈" are approximate or derived. Analyst targets were set on different dates in 2026. This report summarizes public information and is not investment advice.</p>`;
main.appendChild(src);
const gl=document.createElement('section');gl.id='glossary';
gl.innerHTML=`<h2>Glossary of terms</h2><p class="lede">Plain-English definitions of the jargon used in this report. Search for a term or filter by topic.</p>
 <div class="card"><label for="gSearch" class="note">Search the glossary</label><input id="gSearch" type="search" placeholder="Search terms, e.g. ${R.glossary.slice(0,3).map(g=>g[1].split(' (')[0]).join(', ')}…"><div class="tabs" id="gTabs"></div><div id="gCount" class="note" style="margin:4px 0 10px"></div><div class="grid2" id="gList"></div></div>
 <footer class="note">Report generated ${R.generated_label}. Built for the 13F dashboard's Insights tab (under-the-radar picks as of ${R.picks_asof}).</footer>`;
main.appendChild(gl);
const GC=['All',...new Set(R.glossary.map(g=>g[0]))];let gCat='All';
$('#gTabs').innerHTML=GC.map(c=>`<button data-c="${c}" class="${c==='All'?'on':''}">${c}</button>`).join('');
$('#gTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;gCat=b.dataset.c;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));drawGL();};
$('#gSearch').oninput=drawGL;
function drawGL(){const q=$('#gSearch').value.trim().toLowerCase();const items=R.glossary.filter(g=>(gCat==='All'||g[0]===gCat)&&(!q||(g[1]+' '+g[2]).toLowerCase().includes(q))).sort((a,b)=>a[1].localeCompare(b[1]));
  $('#gCount').textContent=`${items.length} term${items.length===1?'':'s'}`;
  $('#gList').innerHTML=items.map(g=>`<div class="gitem"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>${g[1]}</b><span class="pill">${g[0]}</span></div><div style="font-size:14px;color:var(--ink-2);margin-top:4px">${g[2]}</div></div>`).join('')||'<p class="note">No matches.</p>';}
drawGL();

const drawAll=()=>redraw.forEach(f=>f());drawAll();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawAll,150)});
const links=[...document.querySelectorAll('#nav a')];
const obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section,header.hero').forEach(s=>obs.observe(s));
</script>
</body>
</html>
