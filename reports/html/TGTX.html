<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG Therapeutics Research Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky chapter nav, solid-accent hero with KPI tiles, then numbered chapters of cards and SVG charts (same structure as the Nubank report). */
:root{
  --acc:#7c3aed; --acc-ink:#ffffff; --hero:#3b1d6e;
  --ink:#15171c; --ink-2:#4a4f5a; --ink-3:#7d8390;
  --bg:#f7f8f9; --card:#ffffff; --line:#e3e6ea; --grid:#eef0f3;
  --acc-soft:color-mix(in srgb,var(--acc) 12%,var(--card));
  --s1:#2a78d6; --s2:#e0663a; --s3:#1a9e73; --good:#1a8f4c; --warn:#b97800; --bad:#c2410c;
  --display:Manrope,"Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --acc:#b197fc; --ink:#eef0f3; --ink-2:#c0c5ce; --ink-3:#8c93a0;
    --bg:#121417; --card:#1b1e23; --line:#2e333b; --grid:#262a31; --s1:#4a93e8; --s2:#e8794e; --s3:#2bb487; --good:#3cb371; --warn:#e0a32a; --bad:#f07b4a; color-scheme:dark;}
}
:root[data-theme="dark"]{ --acc:#b197fc; --ink:#eef0f3; --ink-2:#c0c5ce; --ink-3:#8c93a0;
  --bg:#121417; --card:#1b1e23; --line:#2e333b; --grid:#262a31; --s1:#4a93e8; --s2:#e8794e; --s3:#2bb487; --good:#3cb371; --warn:#e0a32a; --bad:#f07b4a; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 10px;border-radius:999px}
nav a.on,nav a:hover{background:var(--acc-soft);color:var(--acc)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
header.hero{background:var(--hero);color:#fff;padding:48px 16px 40px}
header.hero .in{max-width:1080px;margin:0 auto}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-size:clamp(30px,5vw,48px);margin:4px 0 8px;letter-spacing:-.02em;line-height:1.1}
.hero p{margin:0;max-width:680px;opacity:.92;font-size:17px}
.stamp{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stamp span{font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.kpi{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;opacity:.85}
section{padding-top:56px;scroll-margin-top:60px}
h2{font-size:28px;letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.founder{display:flex;gap:14px;align-items:flex-start}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.founder h4{margin:0;font-size:16px}.founder p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3)}
.tl{display:flex;overflow-x:auto;padding:8px 0 4px}
.tl button{flex:1 0 104px;background:none;border:0;cursor:pointer;padding:28px 6px 8px;position:relative;color:var(--ink-2);font:inherit;font-size:13px;text-align:center}
.tl button::before{content:"";position:absolute;top:12px;left:0;right:0;height:3px;background:var(--line)}
.tl button::after{content:"";position:absolute;top:6px;left:50%;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--card);border:3px solid var(--acc)}
.tl button.on{color:var(--acc);font-weight:700}
.tl button.on::after{background:var(--acc)}
.tl-detail{margin-top:10px;min-height:96px}
.tl-detail h3{margin:0 0 4px;font-size:18px}
.ch{cursor:pointer;transition:transform .15s;text-align:left;font:inherit;color:inherit;width:100%}
.ch:hover{transform:translateY(-2px)}
.ch .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ch h4{margin:6px 0 4px;font-size:16px}
.ch p{margin:0;font-size:14px;color:var(--ink-2)}
.ch .more{display:none;margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px;color:var(--ink)}
.ch.open .more{display:block}
.ch .hint{font-size:12px;color:var(--acc);margin-top:8px}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--grid);border-radius:999px;padding:3px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
svg text{fill:var(--ink-3);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
svg .val{fill:var(--ink);font-weight:600}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:20;max-width:280px}
.tip b{display:block;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.evlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;background:var(--card);text-align:left;font-family:inherit;color:var(--ink-2)}
.ev b{display:block;color:var(--ink)}
.ev .p{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.ev.on{border-color:var(--acc);background:var(--acc-soft)}
.seg{border-top:4px solid var(--c,var(--acc))}
.seg .big{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--grid);color:var(--ink-2);margin:2px 4px 2px 0}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.val-card{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;font:inherit;color:inherit}
.val-card .n{font-size:13px;font-weight:700;color:var(--acc)}
.val-card h4{margin:6px 0 0;font-size:16px;line-height:1.3}
.val-card.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.val-card.on .n{color:var(--acc-ink)}
.callout{border-left:4px solid var(--acc);background:var(--acc-soft);padding:14px 16px;border-radius:0 12px 12px 0;font-size:15px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-3);font-weight:600}
td.r,th.r{text-align:right}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:10px}
.src li{font-size:13px;margin-bottom:4px}
.meter{height:8px;background:var(--grid);border-radius:999px;overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--acc)}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.sig b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 4px}
input[type=search]{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:12px}
.gitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:16px}
</style>
</head>

<script>
const R = {"title": "TG Therapeutics Research Report", "name": "TG Therapeutics", "exchange": "Nasdaq", "accent": "#7c3aed", "accent_dark": "#b197fc", "hero": "#3b1d6e", "price_start": "2019-01-01", "tagline": "TG Therapeutics turned a collapsed cancer program into a roughly $1B multiple sclerosis business. Its drug Briumvi is a one-hour infusion given twice a year. The stock fell about 90% in 2022 and has since risen more than fifteen-fold.", "kpis": [["$259.9M", "Q3 2026 total revenue"], ["$232.6M", "Briumvi US net sales, +52% YoY"], ["~$1B", "2026 global revenue guidance (raised)"], ["$100M", "stock bought back in Q3 2026"], ["YE26 / 1Q27", "subcutaneous Briumvi Phase 3 readout"]], "chapters": [{"id": "founding", "nav": "Founding", "title": "The founding story", "lede": "TG Therapeutics was built around one antibody, ublituximab, a re-engineered anti-CD20 drug licensed in 2012. Chairman and CEO Michael Weiss first bet on blood cancers. When that program collapsed in 2022, the company was left with its multiple sclerosis trials, and those became the entire business.", "blocks": [{"type": "people", "items": [["MW", "Michael Weiss", "Chairman and CEO. He steered the company through the 2022 cancer withdrawal and into a successful MS launch."], ["UB", "Ublituximab", "The molecule behind everything. It is an anti-CD20 antibody engineered to kill B cells efficiently, which allows a short one-hour infusion."], ["NP", "Partners", "Ex-US rights to Briumvi are licensed to a European partner. TG keeps the US market, where most of the revenue is."]]}, {"type": "timeline", "start": 5, "items": [["2012", "Ublituximab licensed", "TG licenses the anti-CD20 antibody that would become Briumvi and builds the company around it."], ["2014–19", "Blood-cancer bet", "TG pairs ublituximab with umbralisib, an oral PI3K-delta inhibitor, for chronic lymphocytic leukemia and lymphoma. It also runs the ULTIMATE Phase 3 trials in MS."], ["Feb 2021", "Ukoniq approved", "Umbralisib (Ukoniq) gets FDA accelerated approval for two lymphomas, and the stock nears $50."], ["Apr 2022", "The collapse", "Overall-survival concerns in the UNITY-CLL trial lead TG to withdraw its cancer applications and pull Ukoniq from the market. The FDA also delays the MS decision."], ["Jun 2022", "Bottom: ~$4", "The stock falls about 90% from its peak, leaving MS as the only program."], ["Dec 2022", "Briumvi approved", "The FDA approves Briumvi (ublituximab) for relapsing forms of multiple sclerosis."], ["2023–24", "Launch against giants", "Briumvi goes up against Roche's Ocrevus and Novartis's Kesimpta and wins share with its one-hour infusion. Ex-US rights are partnered."], ["2025", "Scale", "Sales compound, and subcutaneous Briumvi enters Phase 3."], ["Nov 2026", "A $1B company", "Q3 Briumvi US sales rise 52%. Global 2026 guidance goes up to about $1B, and TG buys back $100M of stock."]]}]}, {"id": "challenges", "nav": "Early challenges", "title": "Early challenges", "lede": "Few biotechs survive having their lead cancer drug withdrawn and then out-launch two of the world's biggest drug makers. Tap a card to see how TG got through each problem.", "blocks": [{"type": "cards", "items": [["Safety", "A drug pulled for safety", "Ukoniq was withdrawn in 2022 after a possible increase in the risk of death, and the FDA tightened scrutiny of the whole PI3K drug class.", "TG voluntarily withdrew all its cancer applications, cut costs and put everything behind the MS program."], ["Regulatory", "A delayed MS decision", "The FDA pushed back Briumvi's MS decision just as the cancer program fell apart.", "Briumvi was approved in December 2022. The ULTIMATE trials, run against an active comparator, made the data hard to dispute."], ["Competition", "David vs. two Goliaths", "Roche's Ocrevus and Novartis's Kesimpta already dominated anti-CD20 MS treatment.", "TG competed on convenience, with a one-hour infusion every six months after the first doses, and with price and service for infusion centers."], ["Funding", "Cash burn before launch", "With no approved product in mid-2022, the company had to fund a launch while its market value was at its lowest.", "Fast Briumvi uptake turned TG profitable. It now buys back stock, about $100M in Q3 2026 alone."], ["Format", "No self-injected version", "Kesimpta is a monthly self-injection and Roche has a subcutaneous Ocrevus. Briumvi is only infused.", "A subcutaneous Briumvi Phase 3 reads out at the end of 2026 or early 2027. TG models quarterly dosing and is targeting a 2028 launch."], ["Concentration", "A one-drug company", "Almost all revenue comes from Briumvi in one country.", "TG is running Phase 2 programs in myasthenia gravis and treatment-resistant schizophrenia, plus azer-cel, a cell therapy for autoimmune disease."]]}]}, {"id": "growth", "nav": "Growth", "title": "Growth", "lede": "Briumvi took less than four years to go from launch to about $900M of US sales. Growth is still above 50% but is slowing as the base gets larger.", "blocks": [{"type": "bars", "tabs": [{"label": "Briumvi US sales, annual", "fmt": "usdM", "note": "US$ millions. 2023–2025 are approximate reported totals (≈). The 2026 bar is the midpoint of the raised $915–920M guidance.", "data": [["2023", 89, "First full launch year", 1], ["2024", 310, "Approx. reported", 1], ["2025", 570, "Approx. reported", 1], ["2026 guide", 917, "Midpoint of $915–920M"]]}, {"label": "Briumvi US sales, quarterly", "fmt": "usdM", "note": "US$ millions. The 2025 quarters are derived from the reported growth rates, so they're marked ≈.", "data": [["Q2 2025", 139, "Derived from +64% YoY", 1], ["Q3 2025", 153, "Derived from +52% YoY", 1], ["Q2 2026", 227.7, "+64% YoY"], ["Q3 2026", 232.6, "+52% YoY"]]}, {"label": "YoY growth", "fmt": "pct", "note": "Year-over-year growth in Briumvi US net sales.", "data": [["Q2 2026", 64, "US sales $227.7M"], ["Q3 2026", 52, "US sales $232.6M"]]}]}, {"type": "row", "items": [{"type": "facts", "eyebrow": "Q3 2026 snapshot", "items": [["Total global revenue", "$259.9M, ahead of the ~$245–247M consensus"], ["Briumvi US net sales", "$232.6M (+52%)"], ["EPS", "$0.35"], ["Share buyback", "About $100M in Q3"], ["Stock reaction", "+5.9% after earnings"]]}, {"type": "facts", "eyebrow": "2026 guidance (raised Nov 2026)", "items": [["Global revenue", "About $1B (was about $950M)"], ["Briumvi US net sales", "$915–920M (was $890–905M)"], ["Subcutaneous Phase 3", "Topline at year-end 2026 or 1Q 2027"], ["Subcutaneous launch target", "2028"]]}]}, {"type": "callout", "html": "<b>Watch-out:</b> growth fell from 64% to 52% in one quarter. The market is now valuing TG on how long Briumvi can keep taking share, and on whether a subcutaneous version can defend it once Ocrevus faces biosimilars later this decade."}]}, {"id": "stock", "nav": "Stock", "title": "Stock trajectory", "lede": "Few stocks have had a round trip like this. TG rose to about $48 on the Ukoniq approval, fell to about $4 when the cancer program collapsed, and climbed more than fifteen-fold on Briumvi. Hover over the line, switch to the S&P 500 comparison, or click an event.", "blocks": [{"type": "price", "events": [["2021-02-05", "Ukoniq approved", "Accelerated approval in two lymphomas. The stock was near its high."], ["2022-04-15", "Cancer program pulled", "Overall-survival concerns: TG withdraws its applications and Ukoniq."], ["2022-06-30", "The bottom", "About $4, down roughly 90% from the peak."], ["2022-12-28", "Briumvi approved", "The FDA approves it for relapsing MS, and the turnaround begins."], ["2026-02-27", "Early-2026 guidance dip", "Initial 2026 guidance trailed consensus despite projected growth of about 54%, and the stock fell into the $20s."], ["2026-11-10", "Q3 beat, $1B guide", "Shares rose about 6% on the raised guidance."]], "note": "Month-end closing prices from Yahoo Finance, with the last point at the latest close. Event dots sit on the nearest month-end. This is not investment advice."}]}, {"id": "market", "nav": "Market", "title": "The MS market & pipeline", "lede": "Anti-CD20 antibodies, which deplete the B cells that drive MS attacks, have become the leading high-efficacy treatment for relapsing MS. Three drugs compete, and convenience is now the main battleground.", "blocks": [{"type": "segments", "items": [{"title": "Briumvi (TG)", "big": "1 hour", "sub": "infusion, twice a year after the first doses", "color": "var(--acc)", "text": "TG's MS drug has the shortest infusion in the class. It is popular with infusion centers and patients who don't want monthly shots.", "pills": [["g", "+52% growth"], ["w", "Infusion only, for now"]]}, {"title": "Ocrevus (Roche)", "big": "Leader", "sub": "the incumbent anti-CD20", "color": "var(--s1)", "text": "The category's original blockbuster, with an infused version and a subcutaneous version.", "pills": [["w", "Sales still growing"]], "more": "Biosimilar competition to Ocrevus later in the decade could pressure prices across the class."}, {"title": "Kesimpta (Novartis)", "big": "Monthly", "sub": "self-injection at home", "color": "var(--s2)", "text": "Its home self-injection gives Novartis a format advantage that TG doesn't yet have.", "pills": [["w", "Sales still growing"]]}, {"title": "Subcutaneous Briumvi", "big": "Phase 3", "sub": "topline at year-end 2026 or 1Q 2027", "color": "var(--s3)", "text": "This is TG's answer to the format gap. Pharmacokinetic modeling supports quarterly dosing, and the launch target is 2028.", "pills": [["g", "Key catalyst"]]}, {"title": "Beyond MS", "big": "3 programs", "sub": "myasthenia gravis · schizophrenia · azer-cel", "color": "var(--ink-3)", "text": "These are Phase 2 work in generalized myasthenia gravis and treatment-resistant schizophrenia, plus azer-cel, a cell therapy for autoimmune disease.", "pills": [["w", "Early stage"]], "more": "Kyverna's KYV-101 is an emerging rival to azer-cel in MS, though its early data come from only a handful of patients."}]}]}, {"id": "priorities", "nav": "Priorities", "title": "What the company prizes", "lede": "TG's strategy since 2022 has been narrow: win in B-cell therapy for MS, then use the cash it generates for new formats, new indications and buybacks. Tap a priority to see how it shows up in practice.", "blocks": [{"type": "values", "label": "Priority", "items": [["Convenience as the competitive edge", "Compete on patient and clinic time, not just efficacy.", "Briumvi's one-hour infusion, and a subcutaneous version modeled for quarterly dosing."], ["Focus", "Put everything behind the program that works.", "After 2022 TG dropped oncology entirely and concentrated on MS."], ["Execution against bigger rivals", "Win infusion centers and neurologists one at a time.", "US sales went from about $89M in 2023 to a guided $915–920M in 2026."], ["Expanding B-cell biology", "Use what it knows about B cells in other immune diseases.", "Phase 2 programs in myasthenia gravis and schizophrenia, and azer-cel."], ["Shareholder returns", "Return cash once the business is self-funding.", "It bought back about $100M of stock in Q3 2026."]]}]}, {"id": "radar", "nav": "13F view", "title": "Why it's on the radar: the 13F view", "lede": "TGTX made the Insights tab because 8 of the tracked funds hold it, four as conviction positions, and it has the strongest six-month return of the three stock picks.", "blocks": [{"type": "radar", "html": "<b>Big buyers in Q2 2026:</b> D. E. Shaw lifted its stake to about $187M and Two Sigma to about $136M, each roughly tripling in value. Bridgewater holds it at about 0.10% of its book, one of its larger healthcare weights in this dataset."}]}, {"id": "outlook", "nav": "Outlook", "title": "Future outlook: opportunities & risks", "lede": "Analysts are split more sharply on TG than on the other picks. Targets range from $20 to $86, and the stock trades above the consensus. The key questions are how long Briumvi can keep gaining share and whether the subcutaneous trial succeeds.", "blocks": [{"type": "targets", "avg": 51.45, "items": [["B. Riley", 86, "Raised from $55 · Jul 27, 2026"], ["HC Wainwright", 77, "Raised from $70 · Jul 2026"], ["JPMorgan", 72, "Raised from $65 · Aug 7, 2026"], ["Bank of America", 20, "Underperform · raised from $17"]], "note": "Benzinga's consensus was about $51.45 as of Oct 22, 2026, and Google Finance's 3-month average was about $59.43. Walnut's July 2026 count was 7 Buy, 0 Hold and 1 Sell. Targets were set on different dates in 2026."}, {"type": "oppRisk", "opp": [["Subcutaneous Briumvi", "A successful Phase 3 would close the format gap with Kesimpta and Ocrevus and could support quarterly at-home dosing from 2028."], ["Continued share gains", "Growth of 50%+ shows Briumvi is still taking patients, both new starts and switches."], ["Profitability + buybacks", "A self-funding business can return cash. TG bought back about $100M in Q3."], ["Ex-US royalties", "The European partnership adds revenue without TG building its own sales force there."], ["Pipeline optionality", "Myasthenia gravis, schizophrenia and azer-cel could each add a second leg."], ["M&A appeal", "A profitable, growing neurology franchise could interest larger drug makers."]], "risk": [["Single-product risk", "Almost all revenue comes from one drug in one country."], ["Format competition", "Kesimpta's self-injection and subcutaneous Ocrevus target patients who prefer to avoid infusions."], ["Biosimilars & pricing", "Eventual Ocrevus biosimilars and Medicare price negotiation could compress prices across the class."], ["Trial risk", "A subcutaneous Phase 3 miss would hurt the long-term story."], ["Slowing growth", "Growth fell from 64% to 52% in a quarter, and the rate of slowdown drives the valuation."], ["Valuation gap", "The stock trades above the consensus target, and BofA's $20 target implies about 70% downside."]]}, {"type": "bullbear", "items": [["Bear case (BofA $20)", "Briumvi growth fades as the subcutaneous rivals and later biosimilars arrive. The subcutaneous trial disap B.price=(b,host)=>{host.className='card';const P=R.prices[R.ticker].map(d=>[new Date(d[0]),d[1]]);const SPY=R.prices.SPY.map(d=>[new Date(d[0]),d[1]]);

      cross.setAttribute('x1',X(p[0]));cross.setAttribute('x2',X(p[0]));cross.setAttribute('opacity',.5);dot.setAttribute('cx',X(p[0]));dot.setAttribute('cy',Y(p[1]));dot.setAttribute('opacity',1);

const drawAll=()=>redraw.forEach(f=>f());drawAll();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawAll,150)});
const links=[...document.querySelectorAll('#nav a')];
const obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section,header.hero').forEach(s=>obs.observe(s));
</script>
</body>
</html>
